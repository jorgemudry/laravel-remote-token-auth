name: run-tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.4, 8.3, 8.2, 8.1]
        laravel: [12.*, 11.*, 10.*]
        dependency-version: [prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 11.*
            testbench: 9.*
          - laravel: 10.*
            testbench: 8.*
        exclude:
          - php: 8.1
            laravel: 12.*
          - php: 8.1
            laravel: 11.*
          - php: 8.4
            laravel: 10.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - T${{ matrix.testbench }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          # Laravel 10/11 are past security-fix EOL, so every release carries
          # open advisories and Composer's advisory policy refuses to install
          # them. Testing against those versions is the whole point of this
          # matrix, so disable the block (CI only).
          composer config policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Execute tests
        run: ./vendor/bin/pest
